    <!-- CONTOH 1 Vanila JS -->
    <div class="counter-apps" style="text-align: center; margin-top: 70px;">
        <button id="btn-like" style="font-family: sans-serif; font-size: large;">Like (0) </button>
    </div>

    <script>
        // Merubah tampilan tombol Like ketika di klik
        // 1. Inisialisasi variabel dengan nilai awal 0
        let likeCount = 0;

        // 2. Tangkap elemen tombol berdasarkan ID
        const btnLike = document.getElementById('btn-like');
        btnLike.addEventListener('click', function() {   //buat fungsi untuk menjalankan event klik
            likeCount = likeCount + 1;                   //data berubah                                
            btnLike.innerText = `Like (${likeCount})`;   //render ulang manual & tampilkan data terbaru
        });
    </script>

    <!--CONTOH 3 React -->

    <!-- Menggunakan React dengan 2 komponen -->

    <div id="root"></div> 
    


    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState } = React;

// Komponen Child: Bertugas menampilkan data dan tombol
function DisplayCounter({ nilai, tambah, kurang, reset }) {
  return (
    <div style={{ textAlign: 'center', marginTop: '50px' }}>
      <h1>Angka Saat Ini: {nilai}</h1>
      <button onClick={tambah}> + Tambah </button>
      <button onClick={kurang}> - Kurang </button>
      <button onClick={reset}> Reset </button>
    </div>
  );
}

// Komponen Parent (Utama)
function App() {
  // 1. Inisialisasi State
  const [skor, setSkor] = useState(0);

  // 2. Fungsi Logika
  const handleTambah = () => setSkor(skor + 1);
  const handleKurang = () => setSkor(skor - 1);
  const handleReset = () => setSkor(0);

  return (
    <div>
      {/* 3. Memanggil Komponen Child sambil mengirimkan Data & Fungsi */}
      <DisplayCounter 
        nilai={skor} 
        tambah={handleTambah} 
        kurang={handleKurang} 
        reset={handleReset} 
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

    </script>
